<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unir PDFs</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--ink:#16202e;--muted:#5d6b7c;--line:#d5dce5;--accent:#1f5fd6;--accent-ink:#fff;--danger:#b3261e;--drop:#e8f0fe}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--surface:#18202a;--ink:#e8edf3;--muted:#9aa8b8;--line:#2b3644;--accent:#6ea0ff;--accent-ink:#0b1220;--danger:#ff8a80;--drop:#1b2a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Iowan Old Style","Palatino Linotype",Georgia,serif;padding:clamp(16px,4vw,48px)}
main{max-width:640px;margin:0 auto}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1;margin:0 0 .4rem;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 1.6rem;max-width:52ch}
button,.btn{font:600 .95rem/1 system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.7rem 1rem;border-radius:8px;cursor:pointer}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:2rem 1rem;text-align:center;background:var(--surface);cursor:pointer;font-family:system-ui,sans-serif;color:var(--muted)}
.drop.over{background:var(--drop);border-color:var(--accent)}
.drop strong{color:var(--ink)}
ol{list-style:none;margin:1.2rem 0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;font-family:system-ui,sans-serif}
li.dragging{opacity:.4}
li.target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.grip{cursor:grab;color:var(--muted);user-select:none;font-size:1.2rem;line-height:1}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{color:var(--muted);font-size:.85rem;white-space:nowrap}
li button{padding:.45rem .6rem;font-size:.85rem}
li button.del{color:var(--danger)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{color:var(--muted);font:.9rem system-ui,sans-serif;margin-top:1rem;min-height:1.3em}
.status.err{color:var(--danger)}
.empty{color:var(--muted);font-family:system-ui,sans-serif;text-align:center;margin:1.2rem 0}
</style>
</head>
<body>
<main>
  <h1>Unir PDFs</h1>
  <p class="sub">Agrega tus archivos, ordénalos arrastrando y descarga uno solo. Las páginas se copian sin cambios: sin márgenes nuevos ni espacios en blanco. Todo ocurre en tu navegador; los archivos no se suben a ningún servidor.</p>

  <label class="drop" id="drop" tabindex="0">
    <strong>Elige PDFs</strong> o suéltalos aquí
    <input id="input" type="file" accept="application/pdf,.pdf" multiple hidden>
  </label>

  <ol id="list"></ol>
  <p class="empty" id="empty">Aún no hay archivos.</p>

  <div class="bar">
    <button class="primary" id="merge" disabled>Combinar y descargar</button>
    <button id="sort" disabled>Ordenar A-Z</button>
    <button id="clear" disabled>Vaciar lista</button>
  </div>
  <p class="status" id="status" role="status"></p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script>
const { PDFDocument } = PDFLib;
const $ = id => document.getElementById(id);
const files = [];
let uid = 0, dragFrom = null;

function setStatus(msg, err = false) {
  $('status').textContent = msg;
  $('status').className = 'status' + (err ? ' err' : '');
}

async function addFiles(fileList) {
  const skipped = [];
  for (const f of fileList) {
    if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { skipped.push(f.name); continue; }
    try {
      const bytes = await f.arrayBuffer();
      const doc = await PDFDocument.load(bytes, { ignoreEncryption: true });
      files.push({ id: ++uid, name: f.name, bytes, pages: doc.getPageCount() });
    } catch (e) { skipped.push(f.name); }
  }
  render();
  setStatus(skipped.length ? 'No se pudieron leer: ' + skipped.join(', ') : '', skipped.length > 0);
}

function move(i, j) {
  if (j < 0 || j >= files.length || i === j) return;
  files.splice(j, 0, files.splice(i, 1)[0]);
  render();
}

function render() {
  const ol = $('list');
  ol.replaceChildren();
  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.draggable = true;
    li.innerHTML = '<span class="grip" aria-hidden="true">⋮⋮</span><span class="name"></span><span class="pg"></span>';
    li.querySelector('.name').textContent = (i + 1) + '. ' + f.name;
    li.querySelector('.name').title = f.name;
    li.querySelector('.pg').textContent = f.pages + (f.pages === 1 ? ' pág.' : ' págs.');
    for (const [txt, label, fn, cls] of [
      ['▲', 'Subir', () => move(i, i - 1)],
      ['▼', 'Bajar', () => move(i, i + 1)],
      ['✕', 'Quitar', () => { files.splice(i, 1); render(); }, 'del'],
    ]) {
      const b = document.createElement('button');
      b.textContent = txt; b.setAttribute('aria-label', label + ' ' + f.name);
      if (cls) b.className = cls;
      b.onclick = fn; li.appendChild(b);
    }
    li.ondragstart = e => { dragFrom = i; li.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
    li.ondragend = () => { dragFrom = null; render(); };
    li.ondragover = e => { if (dragFrom === null) return; e.preventDefault(); li.classList.add('target'); };
    li.ondragleave = () => li.classList.remove('target');
    li.ondrop = e => { if (dragFrom === null) return; e.preventDefault(); move(dragFrom, i); dragFrom = null; };
    ol.appendChild(li);
  });
  const has = files.length > 0;
  $('empty').hidden = has;
  $('merge').disabled = files.length < 2;
  $('sort').disabled = !has;
  $('clear').disabled = !has;
}

async function merge() {
  $('merge').disabled = true;
  setStatus('Combinando…');
  try {
    const out = await PDFDocument.create();
    for (const f of files) {
      const src = await PDFDocument.load(f.bytes, { ignoreEncryption: true });
      const pages = await out.copyPages(src, src.getPageIndices());
      pages.forEach(p => out.addPage(p));
    }
    const blob = new Blob([await out.save()], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'combinado.pdf';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus('Listo: combinado.pdf con ' + out.getPageCount() + ' páginas.');
  } catch (e) {
    setStatus('No se pudo combinar: ' + e.message, true);
  }
  render();
}

const drop = $('drop');
$('input').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('input').click(); } };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
$('merge').onclick = merge;
$('sort').onclick = () => { files.sort((a, b) => a.name.localeCompare(b.name, 'es', { numeric: true })); render(); };
$('clear').onclick = () => { files.length = 0; render(); setStatus(''); };
render();
</script>
</body>
</html>
